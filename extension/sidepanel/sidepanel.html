<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Etymikon</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>

<div class="app">
  <!--
    One slim header row. Both containers ship EMPTY and are filled
    declaratively from sidepanel.js: #ety-actions from HEADER_ACTIONS,
    #ety-nav from SIDEBAR_VIEWS (which renders tabs only once a second view
    exists).
  -->
  <header class="header">
    <button type="button" id="ety-brand" class="brand"
            aria-label="Etymikon: back to search"
            title="Back to search">Etymikon</button>
    <nav id="ety-nav" class="nav" aria-label="Views"></nav>
    <div id="ety-actions" class="actions"></div>
  </header>
  <div class="searchbar">
    <input id="ety-input" type="text" class="query"
           placeholder="Search a word or a root"
           aria-label="Search an English word or a root"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <!--
    The view container: one child container per registered view, shown and
    hidden by sidepanel.js, never destroyed. The search view's container is
    authored here rather than built at runtime — it is the one view that
    always exists, and content.js's mount() wants a container that is already
    in the document and laid out. Views added to the registry later get their
    container created for them.
  -->
  <div id="ety-views" class="views">
    <div id="ety-view-search" class="view view--search" data-view="search">
      <!--
        THE scroll container. content.js mounts its shadow host in here, and
        the panel gives up its own overflow in embed mode, so there is exactly
        one scrollbar on this page.
      -->
      <div id="ety-results" class="results">
        <p id="ety-status" class="status"></p>
      </div>
    </div>
  </div>
</div>

<!--
  Load order is load-bearing and every one of these is a CLASSIC script (no
  type=module / defer / async): the boot flag must be set before content.js
  evaluates, search-shell.js needs the embed API content.js exposes,
  sidepanel.js needs the shell, and the view scripts need the registry
  sidepanel.js exposes — each of them self-registers on load, which is what
  makes the nav row appear. They sit AFTER the markup so mount() sees a
  laid-out container. MV3's extension-page CSP forbids inline script, so none
  of this can be collapsed into the page.

  The first three lines are surface-independent: any future extension page
  loads them verbatim and supplies only its own bootstrapper.
-->
<script src="boot.js"></script>
<script src="../content/content.js"></script>
<script src="search-shell.js"></script>
<script src="sidepanel.js"></script>
<script src="saved-view.js"></script>
<script src="settings-view.js"></script>

</body>
</html>
